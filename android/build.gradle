allprojects { repositories { google(); mavenCentral() } }

// on_audio_query_android 1.1.0 predates AGP's required namespace DSL and
// still compiles Java with its legacy 1.8 target. Configure it for the same
// Java 17 target that Kotlin 2.2 uses until the plugin publishes an updated
// Android module.
subprojects { project ->
  project.plugins.withId('com.android.library') {
    if (project.name == 'on_audio_query_android' && project.android.namespace == null) {
      project.android.namespace = 'com.lucasjosino.on_audio_query'
    }
    if (project.name == 'on_audio_query_android') {
      project.android.compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
      }
    }
  }
}
